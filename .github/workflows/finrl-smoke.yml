name: FinRL Smoke Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Start Streamlit and verify health
        env:
          PYTHONPATH: src
        run: |
          streamlit run src/web/app.py --server.address 127.0.0.1 --server.port 8501 --server.headless true > /tmp/finrl-streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo
              echo 'FinRL Streamlit health check passed.'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/finrl-streamlit.log
          exit 1
